name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: nothing here needs the repository contents until the very
# last step, which publishes a release.  That job asks for write access
# itself; everything before it runs read only.
permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg, PyInstaller and a private ffmpeg
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install --upgrade pip
          # Bounded ranges rather than "latest", so a new major version cannot
          # change the build without a commit to this file.  imageio-ffmpeg
          # 0.6.0 is the first release that bundles an ffmpeg new enough to
          # have the setts bitstream filter: 0.5.x bundles ffmpeg 4.2.2, which
          # predates it.  The step below checks the bundled binary anyway, so
          # a bad resolution fails the build instead of shipping a broken exe.
          python -m pip install "pyinstaller>=6.10,<7" "imageio-ffmpeg>=0.6,<0.7"

      - name: Check the ffmpeg that would be bundled
        # The copy path needs the setts bitstream filter, which arrived in
        # ffmpeg 5.0.  The wheel bundles a private build whose version is not
        # ours to choose, so it has to be checked rather than assumed.
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Write-Host "the wheel bundles $ffmpeg"
          & $ffmpeg -hide_banner -version
          $bsfs = & $ffmpeg -hide_banner -bsfs
          if (-not ($bsfs -match "^\s*setts\s*$")) {
            throw "the bundled ffmpeg has no setts bitstream filter; ave2mp4 needs ffmpeg 5.0 or newer"
          }

      - name: Run the test suite before packaging
        run: python tests/test_ave2mp4.py

      - name: Build ave2mp4.exe
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Write-Host "bundling $ffmpeg"
          Copy-Item $ffmpeg ffmpeg.exe
          python -m PyInstaller --onefile --console --name ave2mp4 `
            --exclude-module imageio_ffmpeg `
            --add-binary "ffmpeg.exe;." ave2mp4.py
          Get-Item dist\ave2mp4.exe | Format-List Name, Length

      - name: Smoke test the packaged binary
        shell: pwsh
        run: |
          # A synthetic export, so the test needs no real footage.
          python tests/make_sample.py sample.ave 24 8

          $log = & .\dist\ave2mp4.exe sample.ave --force 2>&1 | Out-String
          Write-Host $log

          if ($LASTEXITCODE -ne 0) { throw "ave2mp4.exe failed with exit code $LASTEXITCODE" }
          if ($log -notmatch '_MEI') { throw "the bundled ffmpeg was not used" }
          if (-not (Test-Path sample.mp4)) { throw "no MP4 was produced" }

          $frames = (ffprobe -v error -select_streams v:0 -count_frames `
            -show_entries stream=nb_read_frames -of csv=p=0 sample.mp4).Trim()
          if ([int]$frames -ne 32) { throw "expected 32 frames, got '$frames'" }
          Write-Host "the packaged binary produced $frames frames"

          # The documented CLI has to work, not just the happy path.
          & .\dist\ave2mp4.exe --version
          if ($LASTEXITCODE -ne 0) { throw "ave2mp4.exe --version failed" }
          & .\dist\ave2mp4.exe --info sample.ave
          if ($LASTEXITCODE -ne 0) { throw "ave2mp4.exe --info failed" }
          if (-not (Test-Path sample.mp4)) { throw "--info changed the filesystem" }

          # A second run must not silently replace the file.
          $before = (Get-Item sample.mp4).LastWriteTimeUtc
          & .\dist\ave2mp4.exe sample.ave | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "an existing MP4 was replaced without --force" }
          if ((Get-Item sample.mp4).LastWriteTimeUtc -ne $before) { throw "the MP4 was touched" }

          # --info must not create the output directory.
          & .\dist\ave2mp4.exe --info -o .\out sample.ave | Out-Null
          if (Test-Path .\out) { throw "--info created the output directory" }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        permissions:
          contents: write
        with:
          files: dist/ave2mp4.exe
          generate_release_notes: true
