name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the test run only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Check the ffmpeg in use is new enough
        # The copy path needs the setts bitstream filter, which arrived in
        # ffmpeg 5.0.  Fail here rather than let every test fail with an
        # obscure ffmpeg error if a runner image ships something older.
        shell: bash
        run: ffmpeg -hide_banner -bsfs | grep -qw setts

      - name: Run the test suite
        shell: bash
        run: python tests/test_ave2mp4.py

      - name: Check that the CLI starts
        run: python ave2mp4.py --version

      - name: A conversion works end to end
        shell: bash
        run: |
          python tests/make_sample.py sample.ave 24 8
          python ave2mp4.py sample.ave --force --verify full
          test -f sample.mp4

      - name: Byte compile the sources
        shell: bash
        run: python -m compileall -q ave2mp4.py tests
